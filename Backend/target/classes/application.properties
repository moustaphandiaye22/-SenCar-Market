# Server Configuration
server.port=8081
server.forward-headers-strategy=framework

# HTTPS / TLS security
# Mettre APP_SECURITY_REQUIRE_SSL=true en production derriere un load balancer TLS
app.security.require-ssl=${APP_SECURITY_REQUIRE_SSL:false}

# Application Name
spring.application.name=Sen-Car-Market

# Database Configuration (PostgreSQL - Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sencarmarket}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET:SenCarMarketSecretKey2024VeryLongSecretKeyForJWTTokenGeneration}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Paiement providers
paiements.wave.api-url=${PAIEMENTS_WAVE_API_URL:https://api.wave.com}
paiements.om.api-url=${PAIEMENTS_OM_API_URL:https://api.orange.com}
paiements.wave.pay-url-base=${PAIEMENTS_WAVE_PAY_URL_BASE:https://wave.com/pay}
paiements.om.pay-url-base=${PAIEMENTS_OM_PAY_URL_BASE:https://om.sn/pay}

# OTP Configuration
otp.expiration-minutes=10
otp.max-tentatives=5
otp.delivery.email.enabled=${OTP_DELIVERY_EMAIL_ENABLED:false}
otp.delivery.email.from=${OTP_DELIVERY_EMAIL_FROM:no-reply@sencarmarket.com}

# Mail Configuration
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.sencarmarket=INFO
