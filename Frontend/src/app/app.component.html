<div class="min-h-screen flex flex-col font-sans">
  <!-- Top Navigation -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-3 cursor-pointer">
        <lucide-angular [img]="icons.Car" class="text-primary-600 block"></lucide-angular>
        <span class="text-xl font-bold tracking-tight text-gray-900">Sen-Car Market</span>
      </a>
      
      <nav class="hidden md:flex gap-8">
        <a routerLink="/" routerLinkActive="text-primary-600 border-primary-600" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-2 font-medium text-gray-500 border-b-2 border-transparent hover:text-primary-600 hover:border-primary-600 py-5 transition-colors">
          <lucide-angular [img]="icons.Home" size="18" class="block"></lucide-angular>
          <span>Accueil</span>
        </a>
        <a routerLink="/vehicles" routerLinkActive="text-primary-600 border-primary-600" class="flex items-center gap-2 font-medium text-gray-500 border-b-2 border-transparent hover:text-primary-600 hover:border-primary-600 py-5 transition-colors">
          <lucide-angular [img]="icons.Search" size="18" class="block"></lucide-angular>
          <span>Marketplace</span>
        </a>
        <a routerLink="/professionnels" routerLinkActive="text-primary-600 border-primary-600" class="flex items-center gap-2 font-medium text-gray-500 border-b-2 border-transparent hover:text-primary-600 hover:border-primary-600 py-5 transition-colors">
          <lucide-angular [img]="icons.Briefcase" size="18" class="block"></lucide-angular>
          <span>Professionnels</span>
        </a>
        <ng-container *ngIf="currentUser$ | async">
          <a routerLink="/vehicles/favorites" routerLinkActive="text-primary-600 border-primary-600" class="flex items-center gap-2 font-medium text-gray-500 border-b-2 border-transparent hover:text-primary-600 hover:border-primary-600 py-5 transition-colors">
            <lucide-angular [img]="icons.Heart" size="18" class="block"></lucide-angular>
            <span>Mes Favoris</span>
          </a>
          <a routerLink="/vehicles/me" routerLinkActive="text-primary-600 border-primary-600" class="flex items-center gap-2 font-medium text-gray-500 border-b-2 border-transparent hover:text-primary-600 hover:border-primary-600 py-5 transition-colors">
            <lucide-angular [img]="icons.Car" size="18" class="block"></lucide-angular>
            <span>Mes Annonces</span>
          </a>
        </ng-container>
      </nav>

      <div class="flex items-center gap-4">
        <ng-container *ngIf="(currentUser$ | async) as user; else guest">
          <div class="flex items-center gap-3 pr-2 border-r border-gray-100 mr-2 hidden sm:flex">
            <div class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center text-primary-700 font-bold text-xs">
              {{ user.prenom[0] }}{{ user.nom[0] }}
            </div>
            <div class="flex flex-col">
              <span class="text-xs font-semibold text-gray-900 leading-none">{{ user.prenom }} {{ user.nom }}</span>
              <span class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">{{ user.role }}</span>
            </div>
          </div>
          
          <button (click)="logout()" class="flex items-center gap-2 px-4 py-2 rounded-lg font-medium text-sm text-red-600 hover:bg-red-50 transition-colors">
            <lucide-angular [img]="icons.LogOut" size="18" class="block"></lucide-angular>
            <span class="hidden md:inline">Déconnexion</span>
          </button>
        </ng-container>

        <ng-template #guest>
          <a routerLink="/login" class="hidden md:flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium text-sm text-gray-900 border border-gray-200 hover:border-gray-300 hover:bg-gray-50 transition-colors">
            <lucide-angular [img]="icons.LogIn" size="18" class="block"></lucide-angular>
            Connexion
          </a>
        </ng-template>

        <a routerLink="/vehicles/new" class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium text-sm text-white bg-primary-600 hover:bg-primary-700 hover:shadow-lg hover:shadow-primary-100 transition-all focus:ring-2 focus:ring-offset-2 focus:ring-primary-600 group">
          <lucide-angular [img]="icons.Plus" size="18" class="group-hover:rotate-90 transition-transform duration-300"></lucide-angular>
          <span class="hidden sm:inline">Vendre un véhicule</span>
        </a>
        
        <button class="md:hidden p-2 text-gray-900">
          <lucide-angular [img]="icons.Menu" size="24" class="block"></lucide-angular>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow flex flex-col items-center w-full">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-8 w-full">
    <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2 text-gray-500">
        <lucide-angular [img]="icons.Car" size="20" class="block"></lucide-angular>
        <span class="font-bold text-gray-900">Sen-Car Market</span>
      </div>
      <p class="text-sm text-gray-500 m-0">&copy; 2026 Sen-Car Market. Tous droits réservés.</p>
    </div>
  </footer>
</div>
