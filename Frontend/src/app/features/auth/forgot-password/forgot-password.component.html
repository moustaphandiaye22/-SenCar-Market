<div class="min-h-[80vh] flex items-center justify-center px-4 py-12 bg-gray-50/50">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100">
    <div class="text-center">
      <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-primary-50">
        <lucide-angular [img]="icons.Mail" class="h-8 w-8 text-primary-600"></lucide-angular>
      </div>
      <h2 class="mt-6 text-3xl font-extrabold text-gray-900 tracking-tight">Mot de passe oublié</h2>
      <p class="mt-2 text-sm text-gray-600">
        Entrez votre adresse email pour recevoir un code de réinitialisation.
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Adresse Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <lucide-angular [img]="icons.Mail" size="18" class="text-gray-400"></lucide-angular>
            </div>
            <input
              id="email"
              formControlName="email"
              type="email"
              required
              class="appearance-none block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all"
              placeholder="votre@email.com"
            >
          </div>
          <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" class="mt-2 text-sm text-red-600 flex items-center gap-1">
            <lucide-angular [img]="icons.AlertCircle" size="14"></lucide-angular>
            Veuillez entrer une adresse email valide.
          </div>
        </div>
      </div>

      <div *ngIf="errorMessage" class="p-4 rounded-lg bg-red-50 border border-red-100 flex items-start gap-3">
        <lucide-angular [img]="icons.AlertCircle" size="20" class="text-red-600 shrink-0 mt-0.5"></lucide-angular>
        <p class="text-sm text-red-700 font-medium">{{ errorMessage }}</p>
      </div>

      <div *ngIf="successMessage" class="p-4 rounded-lg bg-green-50 border border-green-100 flex items-start gap-3 animate-in fade-in duration-300">
        <lucide-angular [img]="icons.CheckCircle2" size="20" class="text-green-600 shrink-0 mt-0.5"></lucide-angular>
        <p class="text-sm text-green-700 font-medium">{{ successMessage }}</p>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="isLoading || forgotForm.invalid"
          class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-primary-200"
        >
          <lucide-angular [img]="icons.RefreshCw" size="18" class="animate-spin mr-2" *ngIf="isLoading"></lucide-angular>
          {{ isLoading ? 'Envoi en cours...' : 'Envoyer le code' }}
        </button>
      </div>
    </form>

    <div class="text-center pt-6 border-t border-gray-100">
      <a routerLink="/login" class="inline-flex items-center gap-2 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
        <lucide-angular [img]="icons.ChevronLeft" size="16"></lucide-angular>
        Retour à la connexion
      </a>
    </div>
  </div>
</div>
