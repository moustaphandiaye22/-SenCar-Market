<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <div class="w-12 h-12 bg-primary-100 rounded-full flex items-center justify-center">
        <lucide-angular [img]="icons.LogIn" class="text-primary-600 block" size="24"></lucide-angular>
      </div>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Se connecter
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Ou
      <a routerLink="/register" class="font-medium text-primary-600 hover:text-primary-500">
        créer un nouveau compte professionnel ou particulier
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-sm sm:rounded-xl border border-gray-100 sm:px-10">
      
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-6 rounded-md bg-red-50 p-4 border border-red-100">
        <div class="flex">
          <div class="flex-shrink-0">
            <lucide-angular [img]="icons.AlertCircle" size="20" class="text-red-400 block"></lucide-angular>
          </div>
          <div class="ml-3">
            <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
          </div>
        </div>
      </div>

      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Adresse email</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <lucide-angular [img]="icons.Mail" size="18" class="text-gray-400 block"></lucide-angular>
            </div>
            <input id="email" type="email" formControlName="email" autocomplete="email" class="focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2.5 px-3 border outline-none transition-colors" [ngClass]="{'border-red-300': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
          </div>
          <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-2 text-sm text-red-600">
            Veuillez entrer une adresse email valide.
          </p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <lucide-angular [img]="icons.Lock" size="18" class="text-gray-400 block"></lucide-angular>
            </div>
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="motDePasse" autocomplete="current-password" class="focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 pr-10 sm:text-sm border-gray-300 rounded-md py-2.5 px-3 border outline-none transition-colors" [ngClass]="{'border-red-300': loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched}">
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <button type="button" (click)="togglePassword()" class="text-gray-400 hover:text-gray-500 focus:outline-none">
                <lucide-angular [img]="showPassword ? icons.EyeOff : icons.Eye" size="18" class="block"></lucide-angular>
              </button>
            </div>
          </div>
          <p *ngIf="loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched" class="mt-2 text-sm text-red-600">
            Le mot de passe doit faire au moins 8 caractères.
          </p>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-900">
              Se souvenir de moi
            </label>
          </div>

          <div class="text-sm">
            <a routerLink="/forgot-password" class="font-medium text-primary-600 hover:text-primary-500">
              Mot de passe oublié ?
            </a>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="isLoading" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 transition-all">
            <span *ngIf="isLoading">Connexion en cours...</span>
            <span *ngIf="!isLoading">Se connecter</span>
          </button>
        </div>
      </form>
      
    </div>
  </div>
</div>
