<div class="min-h-[80vh] flex items-center justify-center px-4 py-12 bg-gray-50/50">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100">
    <div class="text-center">
      <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-primary-50">
        <lucide-angular [img]="icons.Lock" class="h-8 w-8 text-primary-600"></lucide-angular>
      </div>
      <h2 class="mt-6 text-3xl font-extrabold text-gray-900 tracking-tight">Réinitialisation</h2>
      <p class="mt-2 text-sm text-gray-600">
        Entrez le code reçu par email et votre nouveau mot de passe.
      </p>
    </div>

    <form class="mt-8 space-y-5" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="email" formControlName="email" type="email" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
        </div>

        <div>
          <label for="codeOtp" class="block text-sm font-medium text-gray-700 mb-1">Code OTP (6 chiffres)</label>
          <input id="codeOtp" formControlName="codeOtp" type="text" maxlength="6" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl placeholder-gray-400 text-gray-900 text-center tracking-widest font-bold focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
        </div>

        <div>
          <label for="nouveauMotDePasse" class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe</label>
          <div class="relative">
            <input [type]="showPassword ? 'text' : 'password'" id="nouveauMotDePasse" formControlName="nouveauMotDePasse" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
            <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
              <lucide-angular [img]="showPassword ? icons.EyeOff : icons.Eye" size="18"></lucide-angular>
            </button>
          </div>
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot de passe</label>
          <input [type]="showPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all" [class.border-red-500]="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched">
        </div>
      </div>

      <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched" class="text-sm text-red-600 flex items-center gap-1">
        <lucide-angular [img]="icons.AlertCircle" size="14"></lucide-angular>
        Les mots de passe ne correspondent pas.
      </div>

      <div *ngIf="errorMessage" class="p-4 rounded-lg bg-red-50 border border-red-100 text-sm text-red-700 font-medium">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="p-4 rounded-lg bg-green-50 border border-green-100 text-sm text-green-700 font-medium animate-in fade-in duration-300">
        {{ successMessage }}
      </div>

      <button type="submit" [disabled]="isLoading || resetForm.invalid" class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all disabled:opacity-50 shadow-lg shadow-primary-200">
        <lucide-angular [img]="icons.RefreshCw" size="18" class="animate-spin mr-2" *ngIf="isLoading"></lucide-angular>
        {{ isLoading ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
      </button>
    </form>

    <div class="text-center pt-6 border-t border-gray-100">
      <a routerLink="/login" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Retour à la connexion</a>
    </div>
  </div>
</div>
