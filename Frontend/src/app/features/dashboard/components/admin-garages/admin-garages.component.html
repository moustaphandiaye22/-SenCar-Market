<div class="p-6 lg:p-8 relative overflow-hidden">
  <!-- Decorative background -->
  <div class="absolute top-0 right-0 -mr-20 -mt-20 w-80 h-80 bg-primary-500/5 rounded-full blur-3xl -z-10"></div>

  <div class="mb-10">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
      <div>
        <h2 class="text-4xl font-black text-gray-900 tracking-tight">Garages</h2>
        <p class="text-gray-500 mt-2 font-medium">Validez les demandes d'inscription des professionnels.</p>
      </div>
      <div class="flex items-center gap-3 px-6 py-3 bg-amber-50 border border-amber-100 rounded-[1.5rem]">
        <lucide-angular [img]="icons.ShieldAlert" size="18" class="text-amber-500 flex-shrink-0"></lucide-angular>
        <span class="text-[11px] font-black text-amber-700 uppercase tracking-widest">{{ garages.length }} en attente</span>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="flex justify-center py-24">
    <div class="w-10 h-10 rounded-full border-4 border-gray-100 border-t-primary-600 animate-spin"></div>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && garages.length === 0"
       class="py-24 text-center bg-white rounded-3xl border border-gray-100 shadow-sm">
    <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6">
      <lucide-angular [img]="icons.Building" size="40" class="text-gray-200"></lucide-angular>
    </div>
    <p class="text-gray-400 font-black uppercase tracking-widest">Aucun garage en attente</p>
    <p class="text-gray-300 text-sm mt-2">Toutes les demandes ont été traitées.</p>
  </div>

  <!-- Garage cards -->
  <div *ngIf="!isLoading && garages.length > 0" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div *ngFor="let garage of garages"
         class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 hover:shadow-md transition-all duration-200 group">

      <div class="flex items-start justify-between gap-4 mb-6">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform shadow-inner">
            <lucide-angular [img]="icons.Building" size="24"></lucide-angular>
          </div>
          <div>
            <h3 class="text-lg font-black text-gray-900 group-hover:text-primary-600 transition-colors leading-tight">
              {{ garage.nom }}
            </h3>
            <span class="inline-flex items-center gap-1.5 mt-1">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
              <span class="text-[10px] font-black text-amber-600 uppercase tracking-widest">En attente</span>
            </span>
          </div>
        </div>
      </div>

      <div class="space-y-2 mb-6">
        <div class="flex items-center gap-3 text-sm text-gray-500">
          <span class="w-1.5 h-1.5 rounded-full bg-gray-300 flex-shrink-0"></span>
          <span class="font-bold text-gray-400 uppercase tracking-widest text-[10px]">Tél.</span>
          <span class="font-semibold text-gray-700">{{ garage.telephone }}</span>
        </div>
        <div class="flex items-center gap-3 text-sm text-gray-500">
          <span class="w-1.5 h-1.5 rounded-full bg-gray-300 flex-shrink-0"></span>
          <span class="font-bold text-gray-400 uppercase tracking-widest text-[10px]">Lieu</span>
          <span class="font-semibold text-gray-700">{{ garage.ville }} — {{ garage.adresse }}</span>
        </div>
      </div>

      <div class="flex items-center justify-between pt-6 border-t border-gray-50">
        <a [routerLink]="['/garages', garage.id]"
           target="_blank"
           class="text-primary-600 hover:text-primary-700 font-black text-[11px] uppercase tracking-widest transition-colors">
          Voir la fiche →
        </a>
        <div class="flex gap-2">
          <button (click)="validerGarage(garage.id)"
                  class="flex items-center gap-2 px-5 py-2.5 bg-green-50 text-green-700 rounded-xl text-[11px] font-black uppercase tracking-widest hover:bg-green-100 transition-all active:scale-95">
            <lucide-angular [img]="icons.Check" size="14"></lucide-angular>
            Valider
          </button>
          <button (click)="refuserGarage(garage.id)"
                  class="flex items-center gap-2 px-5 py-2.5 bg-red-50 text-red-600 rounded-xl text-[11px] font-black uppercase tracking-widest hover:bg-red-100 transition-all active:scale-95">
            <lucide-angular [img]="icons.X" size="14"></lucide-angular>
            Refuser
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
