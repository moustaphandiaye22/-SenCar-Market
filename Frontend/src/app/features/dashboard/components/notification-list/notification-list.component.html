<div class="p-6 lg:p-8 relative overflow-hidden">
  <div class="absolute top-0 right-0 -mr-20 -mt-20 w-80 h-80 bg-primary-500/5 rounded-full blur-3xl -z-10"></div>
  
  <div class="mb-10">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-4xl font-black text-gray-900 tracking-tight">Notifications</h2>
        <p class="text-gray-500 mt-2 font-medium">Restez informé de l'activité sur vos annonces et votre compte.</p>
      </div>  
      <button *ngIf="notifications.length > 0" 
              (click)="markAllAsRead()"
              class="text-sm font-bold text-primary-600 hover:text-primary-700 bg-primary-50 px-4 py-2 rounded-xl transition-all">
        Tout marquer comme lu
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="flex justify-center p-20">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-primary-500 border-t-transparent"></div>
  </div>

  <div *ngIf="!isLoading" class="space-y-3">
    <div *ngFor="let notif of notifications" 
         [class.bg-white]="notif.estLu"
         [class.bg-primary-50]="!notif.estLu"
         [class.border-primary-100]="!notif.estLu"
         class="group border border-gray-100 rounded-2xl p-4 transition-all hover:shadow-md flex items-start gap-4">
      
      <div [class]="getTypeColor(notif.type)" class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0">
        <lucide-angular [img]="getTypeIcon(notif.type)" size="22"></lucide-angular>
      </div>

      <div class="flex-1 min-w-0" (click)="markAsRead(notif)">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-bold text-gray-900 text-sm md:text-base leading-tight">{{ notif.titre }}</h3>
          <span *ngIf="!notif.estLu" class="w-2 h-2 bg-primary-600 rounded-full"></span>
        </div>
        <p class="text-sm text-gray-600 leading-relaxed mb-2">{{ notif.message }}</p>
        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">{{ notif.dateCreation | date:'dd MMM yyyy, HH:mm' }}</span>
      </div>

      <div class="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <button (click)="deleteNotification(notif.id)" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all">
          <lucide-angular [img]="icons.Trash2" size="18"></lucide-angular>
        </button>
        <button *ngIf="!notif.estLu" (click)="markAsRead(notif)" class="p-2 text-gray-400 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition-all">
          <lucide-angular [img]="icons.CheckCircle2" size="18"></lucide-angular>
        </button>
      </div>
    </div>

    <div *ngIf="notifications.length === 0" class="p-20 text-center bg-gray-50 rounded-3xl border-2 border-dashed border-gray-200">
      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm">
        <lucide-angular [img]="icons.Bell" class="text-gray-200" size="32"></lucide-angular>
      </div>
      <h3 class="text-xl font-bold text-gray-900">Tout est à jour !</h3>
      <p class="text-gray-500 mt-2">Vous n'avez aucune nouvelle notification pour le moment.</p>
    </div>
  </div>
</div>
